<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate" type="application/rss+xml" title="barbosa.md" href="./feed.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="barbosa.md: guias práticos de terminal, áudio e vídeo pela linha de comando e arquitetura de software." />
    <title>barbosa.md | blog de programação</title>
    <script>
      // Anti-FOUC: aplica o tema salvo antes da primeira pintura.
      // Sem escolha salva, o padrão é o tema escuro.
      (function () {
        var THEMES = ["dark", "light", "gruvbox-dark", "dracula", "one-dark", "nord", "catppuccin-dark"];
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved && THEMES.indexOf(saved) > -1) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este blog precisa de JavaScript para montar os artigos a partir dos arquivos markdown.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
