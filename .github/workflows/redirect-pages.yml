# Rode SÓ depois que o blog estiver no ar no Cloudflare Pages.
# Publica no GitHub Pages uma página que redireciona para o endereço novo.
# Na mesma hora, apague .github/workflows/deploy.yml, senão o próximo push
# em main publica o site antigo por cima do redirecionamento.
name: Redirect GitHub Pages to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
